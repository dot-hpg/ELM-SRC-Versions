<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Employee Leave Management System</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h2>Admin Login</h2>
      <p>Employee Leave Management System</p>
    </div>

    <form>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" name = "emailId" [(ngModel)]="loginObj.emailId" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name = "password" [(ngModel)]="login.Obj.password" placeholder="Enter your password" required>
      </div>

      <div class="form-check">
        <input type="checkbox" id="remember">
        <label for="remember">Remember me</label>
      </div>

      <button type="submit" class="login-btn">Login</button>

      <a href="#" class="forgot-link">Forgot Password?</a>
    </form>
  </div>

</body>
</html>
